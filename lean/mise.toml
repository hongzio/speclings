[tools]
go = "1.27.3"
# lean, lake and the rest of the Lean toolchain. Keep the version in sync with
# lean-toolchain (read by editors and elan); leanlings -verify checks that they agree.
"github:leanprover/lean4" = "4.36.0"

[env]
GOPATH = "{{config_root}}/.mise/go"
GOBIN = "{{config_root}}/.mise/go/bin"
# bin/: the leanlings runner
_.path = ["{{config_root}}/bin", "{{config_root}}/.mise/go/bin"]
