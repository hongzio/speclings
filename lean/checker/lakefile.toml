# The checker that compares a learner's exercise with the reference (see Main.lean).
# speclings lean builds it before checking; the build is cached.
name = "speclings-check"
defaultTargets = ["speclings-check"]

[[lean_exe]]
name = "speclings-check"
root = "Main"

# Elaborating a reference (--source) runs Lean's own macros and elaborators, found by name at run time.
supportInterpreter = true
